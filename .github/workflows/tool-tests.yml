# The required run of the process's own repository (build text 1, section 6). It reports on
# every pull request, so that none is left waiting for a run that never reports. It runs the
# tool's own tests only on a ready pull request that changes a file of the tool; a draft, and a
# pull request that changes no file of the tool, pass at once (the owner's decision, 22 Nov 2026).
# A file of the tool: tool/, shims/, the two starting texts the tool fills in, and this workflow.
name: tool-tests
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
jobs:
  tool-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: did a file of the tool change
        id: changed
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          if [ "$DRAFT" = "true" ]; then
            echo "A draft: passed at once. The tool's tests run when it is marked ready, if a file of the tool changed." | tee -a "$GITHUB_STEP_SUMMARY"
          elif git diff --name-only "$BASE" HEAD | grep -qE '^(tool/|shims/|starting_texts/(job|walking-session)\.md$|\.github/workflows/tool-tests\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No file of the tool changed: passed at once." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-node@v4
        if: steps.changed.outputs.run == 'true'
        with:
          node-version: '22'
      - name: the tool's tests
        if: steps.changed.outputs.run == 'true'
        run: |
          git config --global user.email tool-tests@example.com
          git config --global user.name tool-tests
          cd tool && npm ci --no-audit --no-fund && npm test
